<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather App</title>
    <link href="weatherApp.css" rel="stylesheet"/>
  </head>

  <body>
    <div class="app">
      <div class="status-bar">
        <span class="time">9:41</span>
        <span class="dots">•••</span>
      </div>
 
      <header class="picker">
        <label for="city-select" class="picker-label">Choose a location</label>
        <select id="city-select">
          <option value=""></option>
          <option value="new york">New York</option>
          <option value="los angeles">Los Angeles</option>
          <option value="chicago">Chicago</option>
          <option value="paris">Paris</option>
          <option value="tokyo">Tokyo</option>
          <option value="london">London</option>
        </select>
        <button id="get-weather-btn">Get Weather</button>
      </header>
 
      <main id="weather-card" class="card hidden">
        <div class="location-row">
          <h1 id="location">--</h1>
        </div>
  
        <div class="hero">
          <img id="weather-icon" src="" alt="weather icon" />
          <div class="temp-block">
            <span id="main-temperature" class="temp">--</span>
            <span id="weather-main" class="condition">--</span>
          </div>
        </div>
  
        <p class="feels-like-row">Feels like <span id="feels-like">--</span></p>
  
        <div class="divider"></div>
  
        <div class="details-grid">
          <div class="detail">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value">--</span>
          </div>
          <div class="detail">
            <span class="detail-label">Wind</span>
            <span id="wind" class="detail-value">--</span>
          </div>
          <div class="detail">
            <span class="detail-label">Wind Gust</span>
            <span id="wind-gust" class="detail-value">--</span>
          </div>
        </div>
      </main>
    </div>
    <script src="weatherApp.js"></script>
  </body>
</html>
